name: Build places
on:
  push:
    paths: ["tools/**", ".github/workflows/places.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"   # monthly refresh
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_places.py places.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places.json
          git diff --cached --quiet || (git commit -m "Update places.json" && git push)
